    // --- CORRECTED PIXEL ANIMATION (BORDER REMOVED, BOTTOM WORDINGS REMOVED) ---
    function PixelAnimation() {
      const [scene, setScene] = useState(0);
      const [frame, setFrame] = useState(0);

      useEffect(() => {
        const sceneTimer = setInterval(() => setScene((p) => (p + 1) % 3), 3600);
        return () => clearInterval(sceneTimer);
      }, []);

      useEffect(() => {
        const frameTimer = setInterval(() => setFrame((p) => (p + 1) % 8), 250);
        return () => clearInterval(frameTimer);
      }, []);

      const C_ACCENT = '#B7FF5A';
      const C_DARK_ACCENT = '#8CC94A';
      const C_DARK = '#1C1C20';
      const C_MED = '#2A2A2E';
      const C_TEXT = '#F2F0EA';

      const PixelChar = ({ x, y, flip = false, pose = 'idle', color = C_ACCENT, coatColor = C_DARK_ACCENT }) => {
        const bob = (frame % 4 < 2) ? 0 : 1;
        return (
          <g transform={`translate(${x}, ${y + (pose === 'sit' ? 0 : bob)}) ${flip ? 'scale(-1, 1) translate(-10, 0)' : ''}`} shapeRendering="crispEdges">
            <rect x="2" y="0" width="6" height="2" fill={C_MED} />
            <rect x="1" y="2" width="2" height="3" fill={C_MED} />
            <rect x="3" y="2" width="5" height="4" fill={color} />
            <rect x="6" y="3" width="1" height="1" fill={C_DARK} />
            <rect x="4" y="6" width="2" height="1" fill={color} />
            <rect x="2" y="7" width="6" height="6" fill={coatColor} />
            <rect x="4" y="7" width="2" height="6" fill={C_MED} />
            {pose === 'talk' && (
              <>
                <rect x="8" y="7" width="2" height="2" fill={coatColor} />
                <rect x="9" y={frame % 2 === 0 ? 6 : 5} width="2" height="2" fill={color} />
                <rect x="1" y="8" width="1" height="5" fill={coatColor} />
                <rect x="3" y="13" width="2" height="5" fill={C_MED} /><rect x="5" y="13" width="2" height="5" fill={C_MED} />
                <rect x="2" y="17" width="3" height="1" fill="#0B0B0D" /><rect x="5" y="17" width="3" height="1" fill="#0B0B0D" />
              </>
            )}
            {pose === 'listen' && (
              <>
                <rect x="1" y="8" width="1" height="5" fill={coatColor} /><rect x="8" y="8" width="1" height="5" fill={coatColor} />
                <rect x="3" y="13" width="2" height="5" fill={C_MED} /><rect x="5" y="13" width="2" height="5" fill={C_MED} />
                <rect x="2" y="17" width="3" height="1" fill="#0B0B0D" /><rect x="5" y="17" width="3" height="1" fill="#0B0B0D" />
              </>
            )}
            {pose === 'sit' && (
              <>
                <rect x="7" y="8" width="4" height="2" fill={coatColor} /><rect x="11" y={frame % 2 === 0 ? 9 : 8} width="2" height="2" fill={color} />
                <rect x="2" y="13" width="6" height="2" fill={C_MED} /><rect x="6" y="14" width="2" height="4" fill={C_MED} /><rect x="6" y="17" width="3" height="1" fill="#0B0B0D" />
              </>
            )}
            {pose === 'handshake' && (
              <>
                <rect x="1" y="8" width="1" height="5" fill={coatColor} /><rect x="7" y="8" width="4" height="2" fill={coatColor} /><rect x="11" y="8" width="3" height="2" fill={color} />
                <rect x="3" y="13" width="2" height="5" fill={C_MED} /><rect x="5" y="13" width="2" height="5" fill={C_MED} />
                <rect x="2" y="17" width="3" height="1" fill="#0B0B0D" /><rect x="5" y="17" width="3" height="1" fill="#0B0B0D" />
              </>
            )}
          </g>
        );
      };

      return (
        <div className="relative w-full h-full min-h-[280px] sm:min-h-[340px] flex items-center justify-center overflow-hidden select-none">
          <div className="absolute inset-0 bg-grid opacity-25" />

              background: scene === 1 ? '#B7FF5A' : scene === 2 ? '#8CC94A' : '#38bdf8',
              transform: `translate(${scene === 0 ? '-20px' : scene === 1 ? '10px' : '0px'}, -10px)`
            }}
          />
          <svg viewBox="0 0 60 36" preserveAspectRatio="xMidYMid meet" shapeRendering="crispEdges" className="w-full h-full max-h-[380px] drop-shadow-2xl">
            <rect x="0" y="31" width="60" height="1" fill="#232328" />
            {scene === 0 && (
              <g>
                <PixelChar x={11} y={13} pose="talk" color="#60a5fa" coatColor="#2563eb" />
                <PixelChar x={47} y={13} flip={true} pose="listen" color={C_ACCENT} coatColor={C_DARK_ACCENT} />
                <g transform={`translate(16, ${4 + (frame % 2 === 0 ? 0 : -1)})`}>
                  <rect x="0" y="0" width="13" height="7" fill={C_TEXT} />
                  <rect x="2" y="7" width="2" height="2" fill={C_TEXT} />

                  <rect x="5.5" y="3" width="2" height="2" fill={frame % 3 >= 1 ? '#2563eb' : '#93c5fd'} />
                  <rect x="9" y="3" width="2" height="2" fill={frame % 3 >= 2 ? '#2563eb' : '#93c5fd'} />

                  <rect x="2" y="0" width="3" height="1" fill={C_ACCENT} />
                  <rect x="1" y="1" width="5" height="3" fill={C_ACCENT} />
                  <rect x="2" y="4" width="3" height="1" fill="#facc15" />
                  <rect x="2" y="5" width="3" height="1" fill="#71717a" />
                  <rect x="0" y="2" width="1" height="1" fill={C_ACCENT} />
                  <rect x="6" y="2" width="1" height="1" fill={C_ACCENT} />
                  <rect x="3" y="-1" width="1" height="1" fill={C_ACCENT} />
                </g>
              </g>
            )}
            {scene === 1 && (
              <g>
                <rect x="24" y="23" width="30" height="2" fill="#323238" />
                <rect x="26" y="25" width="2" height="6" fill="#25252a" />
                <rect x="50" y="25" width="2" height="6" fill="#25252a" />
                <rect x="14" y="22" width="6" height="2" fill="#3f3f46" />
                <rect x="12" y="16" width="2" height="8" fill="#27272a" />
                <rect x="16" y="24" width="2" height="5" fill="#18181b" />
                <rect x="13" y="29" width="8" height="2" fill="#18181b" />
                <PixelChar x={11} y={13} pose="sit" color={C_ACCENT} coatColor={C_DARK_ACCENT} />
                <rect x="29" y="13" width="14" height="9" fill="#18181b" />
                <rect x="30" y="14" width="12" height="7" fill="#09090b" />
                <rect x="35" y="22" width="2" height="2" fill="#3f3f46" /><rect x="33" y="23" width="6" height="1" fill="#52525b" />
                <rect x="31" y="15" width="4" height="1" fill={C_ACCENT} />
                <rect x="36" y="15" width="3" height="1" fill="#38bdf8" />
                <rect x="31" y="17" width="7" height="1" fill={frame % 2 === 0 ? C_ACCENT : '#8CC94A'} />
                <rect x="31" y="19" width="5" height="1" fill="#a78bfa" />
                <rect x="37" y="19" width="1" height="1" fill={frame % 2 === 0 ? C_ACCENT : 'transparent'} />
                <rect x="45" y="10" width="7" height="12" fill="#18181b" /><rect x="46" y="11" width="5" height="10" fill="#09090b" />
                <rect x="48" y="22" width="1" height="2" fill="#3f3f46" />
                <rect x="47" y="13" width="3" height="1" fill="#38bdf8" /><rect x="47" y="15" width="2" height="1" fill="#38bdf8" /><rect x="47" y="17" width="3" height="1" fill={C_ACCENT} /><rect x="47" y="19" width="2" height="1" fill="#f43f5e" />
                <rect x="25" y="22" width="5" height="1" fill="#52525b" />
                <rect x="25" y="20" width="2" height="3" fill="#e4e4e7" /><rect x="27" y="21" width="1" height="1" fill="#a1a1aa" />
                <rect x="25.5" y={frame % 2 === 0 ? 18 : 17} width="1" height="1" fill="#71717a" opacity="0.6" />
                <rect x="26" y={frame % 2 === 0 ? 16 : 15} width="1" height="1" fill="#71717a" opacity="0.4" />
                <rect x="32" y={frame % 4 + 7} width="1" height="1" fill={C_ACCENT} opacity="0.5" />
                <rect x="42" y={((frame + 2) % 4) + 6} width="1" height="1" fill="#38bdf8" opacity="0.6" />
              </g>
            )}
            {scene === 2 && (
              <g>
                <PixelChar x={16} y={13} pose="handshake" color="#60a5fa" coatColor="#2563eb" />
                <PixelChar x={42} y={13} flip={true} pose="handshake" color={C_ACCENT} coatColor={C_DARK_ACCENT} />
                <g transform="translate(28, 20)">
                  <rect x="0" y="0" width="2" height="2" fill="#60a5fa" />
                  <rect x="2" y="0" width="2" height="2" fill={C_ACCENT} />
                  <rect x="1" y="1" width="2" height="1" fill="#facc15" />
                </g>
                <g transform={`translate(28, ${7 + (frame % 2 === 0 ? 0 : -1)})`}>
                  <rect x="1.5" y="0" width="1" height="4" fill={C_ACCENT} /><rect x="0" y="1.5" width="4" height="1" fill={C_ACCENT} /><rect x="1" y="1" width="2" height="2" fill="#ffffff" />
                </g>
                <rect x="22" y={9 + (frame % 3)} width="1" height="1" fill="#38bdf8" />
                <rect x="37" y={8 + ((frame + 1) % 3)} width="1" height="1" fill="#facc15" />
                <rect x="19" y={12} width="1" height="1" fill={C_ACCENT} opacity="0.7" />
                <rect x="39" y={13} width="1" height="1" fill="#ec4899" opacity="0.7" />
              </g>
            )}
          </svg>

      );
    }

    // --- MAIN APP ---
    function App() {
      const [istTime, setIstTime] = useState('');
      const [scrolled, setScrolled] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);
      const [scrollPercent, setScrollPercent] = useState(0);
      const [hoveredTool, setHoveredTool] = useState(null);

      const [formData, setFormData] = useState({ name: '', email: '', type: '', message: '' });
      const [contactStatus, setContactStatus] = useState('idle'); // 'idle' | 'sending' | 'success'
      const [copied, setCopied] = useState(false);
      const [contactNotice, setContactNotice] = useState('');

      const emailTarget = 'sudhiraugusto28@gmail.com';

      const getSubject = () => `Project enquiry — ${formData.type || 'General'}`;
      const getBody = () => `Name: ${formData.name}\nEmail: ${formData.email}\nProject Type: ${formData.type}\n\nMessage:\n${formData.message}`;

      const getGmailUrl = () => {
        const su = encodeURIComponent(getSubject());
        const body = encodeURIComponent(getBody());
        return `https://mail.google.com/mail/?view=cm&fs=1&to=${emailTarget}&su=${su}&body=${body}`;
      };

      const getMailtoUrl = () => {
        const su = encodeURIComponent(getSubject());
        const body = encodeURIComponent(getBody());
        return `mailto:${emailTarget}?subject=${su}&body=${body}`;
      };

      const copyToClipboard = async (text) => {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
          } else {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-999999px';
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
          }
          setCopied(true);
          setTimeout(() => setCopied(false), 2500);
        } catch (err) {
          console.error('Failed to copy', err);
        }
      };

      const handleContactSubmit = async (e) => {
        e.preventDefault();
        setContactStatus('sending');
        setContactNotice('');

        const payload = {
          name: formData.name,
          email: formData.email,
          project_type: formData.type,
          message: formData.message,
          _subject: getSubject(),
          _template: 'table',
          _captcha: 'false',
        };

        try {
          const response = await fetch(`https://formsubmit.co/ajax/${emailTarget}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Accept: 'application/json',
            },
            body: JSON.stringify(payload),
          });
          const data = await response.json().catch(() => ({}));

          if (data && data.success === 'true') {
            setContactNotice('Delivered directly to Sudhir via secure dispatch.');
          } else if (data && data.message && data.message.includes('Activation')) {
            setContactNotice('Enquiry registered! Note: First-time direct dispatch sent an activation link to Sudhir. You can also send via Gmail directly below.');
          } else {
            setContactNotice('Ready to transmit via your preferred email service.');
          }
        } catch (err) {
          setContactNotice('Network check completed. Use 1-click Gmail or your default email client below.');
        } finally {
          setContactStatus('success');
        }
      };

      const handleResetContact = () => {
        setFormData({ name: '', email: '', type: '', message: '' });
        setContactStatus('idle');
        setContactNotice('');
      };

      return (
        <div id="top" className="min-h-screen bg-[#0B0B0D] font-body text-[#F2F0EA] antialiased">
          {/* Scroll Progress */}
          <div className="fixed left-0 top-0 z-40 hidden h-screen w-px md:block">
            <div className="absolute inset-0 bg-[#303034]" />
            <div className="absolute left-0 top-0 w-px origin-top bg-[#B7FF5A] shadow-[0_0_8px_#B7FF5A]" style={{ height: `${scrollPercent}%` }} />
          </div>

          {/* Navbar */}
          <header className={`fixed inset-x-0 top-0 z-50 transition-all duration-300 ${scrolled ? 'border-b border-[#303034] bg-[#0B0B0D]/90 backdrop-blur-md py-3.5 shadow-lg' : 'border-b border-transparent bg-transparent py-5'}`}>
            <nav className="mx-auto flex max-w-[1400px] items-center justify-between px-6 md:px-10">
              <a href="#top" className="font-heading text-base font-bold tracking-tight text-[#F2F0EA] flex items-center gap-2">
                <span className="text-[#B7FF5A]">✦</span>
                <span>SUDHIR</span>
              </a>
              <div className="hidden items-center gap-8 md:flex">
                {['Work', 'Services', 'About', 'Contact'].map((item) => (
